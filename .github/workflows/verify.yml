name: Verify graphics preview
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable PGSimCity source commit to verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: graphics-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NikolayS/PGSimCity
          ref: ${{ inputs.source_ref }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Identify source build
        working-directory: app
        run: echo "PGSIMCITY_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Non-browser tests
        working-directory: app
        run: npm test -- --exclude '**/*.browser.test.*'
      - name: Typecheck and build
        working-directory: app
        run: |
          npm run typecheck
          npm run build
          cp LICENSE NOTICE dist/
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: stable
      - name: Capture matched baseline and polished views
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CDP_REDUCED_MOTION: '1'
        working-directory: app
        run: |
          set -Eeuo pipefail
          mkdir -p ../evidence
          npm run preview -- --host 127.0.0.1 > ../evidence/server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          CDP_PORT=9501 node tools/shoot.mjs 'http://127.0.0.1:4173/' ../evidence/baseline-day.png 45000 1280 760 "window.PGSIMCITY.sim.reset(); window.PGSIMCITY.sim.setKnob('paused',true); window.PGSIMCITY.setThemeMode('day',{persist:false}); window.PGSIMCITY.gfx.setQuality('high'); window.PGSIMCITY.gfx.setMoonDate(new Date('2026-10-11T00:00:00Z'))" > ../evidence/baseline-day.log 2>&1
          CDP_PORT=9502 node tools/shoot.mjs 'http://127.0.0.1:4173/?visual=polish' ../evidence/polished-day.png 45000 1280 760 "window.PGSIMCITY.sim.reset(); window.PGSIMCITY.sim.setKnob('paused',true); window.PGSIMCITY.setThemeMode('day',{persist:false}); window.PGSIMCITY.gfx.setQuality('high'); window.PGSIMCITY.gfx.setMoonDate(new Date('2026-10-11T00:00:00Z')); (()=>{const p=window.PGSIMCITY; const hit=b=>{const r=b.getBoundingClientRect(); if(r.width<=0||r.height<=0||r.x<0||r.y<0||r.right>innerWidth||r.bottom>innerHeight||!b.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)))throw Error('Comparison button blocked');}; for(const b of document.querySelectorAll('[data-visual-mode]'))hit(b); const before=JSON.stringify([p.sim.state,p.gfx.camera.position.toArray(),p.gfx.camera.quaternion.toArray(),p.themeMode(),p.gfx.quality]); if(p.visual.mode!=='polish')throw Error('Polish URL did not select polish'); document.querySelector('[data-visual-mode=baseline]').click(); if(p.visual.mode!=='baseline')throw Error('Baseline switch failed'); document.querySelector('[data-visual-mode=polish]').click(); if(p.visual.mode!=='polish')throw Error('Polish switch failed'); if(before!==JSON.stringify([p.sim.state,p.gfx.camera.position.toArray(),p.gfx.camera.quaternion.toArray(),p.themeMode(),p.gfx.quality]))throw Error('Switch changed state or view'); console.log('COMPARISON_SWITCH_PASS')})()" > ../evidence/polished-day.log 2>&1
          CDP_PORT=9503 node tools/shoot.mjs 'http://127.0.0.1:4173/' ../evidence/baseline-night.png 45000 1280 760 "window.PGSIMCITY.sim.reset(); window.PGSIMCITY.sim.setKnob('paused',true); window.PGSIMCITY.setThemeMode('night',{persist:false}); window.PGSIMCITY.gfx.setQuality('high'); window.PGSIMCITY.gfx.setMoonDate(new Date('2026-10-11T00:00:00Z'))" > ../evidence/baseline-night.log 2>&1
          CDP_PORT=9504 node tools/shoot.mjs 'http://127.0.0.1:4173/?visual=polish' ../evidence/polished-night.png 45000 1280 760 "window.PGSIMCITY.sim.reset(); window.PGSIMCITY.sim.setKnob('paused',true); window.PGSIMCITY.setThemeMode('night',{persist:false}); window.PGSIMCITY.gfx.setQuality('high'); window.PGSIMCITY.gfx.setMoonDate(new Date('2026-10-11T00:00:00Z')); (()=>{const p=window.PGSIMCITY, read=()=>JSON.stringify(p.gfx.scene.children.filter(x=>x.isLight).map(x=>[x.color.getHex(),x.intensity,x.position.toArray(),x.shadow?.intensity])), before=read(); p.visual.set('baseline'); if(read()!==before)throw Error('Night lights changed'); p.visual.set('polish'); if(read()!==before)throw Error('Night lights failed restore'); console.log('NIGHT_IDENTITY_PASS')})()" > ../evidence/polished-night.log 2>&1
          CDP_MOBILE=1 CDP_PORT=9505 node tools/shoot.mjs 'http://127.0.0.1:4173/?visual=polish' ../evidence/polished-phone.png 45000 390 844 "window.PGSIMCITY.sim.reset(); window.PGSIMCITY.sim.setKnob('paused',true); window.PGSIMCITY.setThemeMode('day',{persist:false}); window.PGSIMCITY.gfx.setQuality('high'); (()=>{for(const b of document.querySelectorAll('[data-visual-mode]')){const r=b.getBoundingClientRect(); if(r.width<=0||r.height<=0||r.x<0||r.y<0||r.right>innerWidth||r.bottom>innerHeight||!b.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)))throw Error('Phone comparison button blocked');}console.log('PHONE_SWITCH_PASS')})()" > ../evidence/polished-phone.log 2>&1
          CDP_PORT=9506 node tools/shoot.mjs 'http://127.0.0.1:4173/?visual=baseline' ../evidence/baseline-detail.png 45000 1280 760 "window.PGSIMCITY.sim.reset(); window.PGSIMCITY.sim.setKnob('paused',true); window.PGSIMCITY.setThemeMode('day',{persist:false}); window.PGSIMCITY.gfx.setQuality('high'); Array.from(document.querySelectorAll('button')).find(b=>b.textContent.trim()==='Explore freely')?.click(); window.PGSIMCITY.rig.focusOn({...window.PGSIMCITY.registry.get('shared.buffers').focus,distance:180,dir:[1,0.55,1]},{instant:true})" > ../evidence/baseline-detail.log 2>&1
          CDP_PORT=9507 node tools/shoot.mjs 'http://127.0.0.1:4173/?visual=polish' ../evidence/polished-detail.png 45000 1280 760 "window.PGSIMCITY.sim.reset(); window.PGSIMCITY.sim.setKnob('paused',true); window.PGSIMCITY.setThemeMode('day',{persist:false}); window.PGSIMCITY.gfx.setQuality('high'); Array.from(document.querySelectorAll('button')).find(b=>b.textContent.trim()==='Explore freely')?.click(); window.PGSIMCITY.rig.focusOn({...window.PGSIMCITY.registry.get('shared.buffers').focus,distance:180,dir:[1,0.55,1]},{instant:true})" > ../evidence/polished-detail.log 2>&1
          python3 -c 'import glob,json,re; logs=glob.glob("../evidence/*-day.log")+glob.glob("../evidence/*-night.log")+glob.glob("../evidence/*-phone.log")+glob.glob("../evidence/*-detail.log"); assert len(logs)==7; [(lambda s: (lambda p: (p["bootDone"] and p["canvas"] and p["components"]>0) or (_ for _ in ()).throw(AssertionError("City did not initialize")))(json.loads(re.search(r"=== PROBE ===\n([^\n]+)",s).group(1))) if "[EXCEPTION]" not in s and "[PRE-FAIL]" not in s else (_ for _ in ()).throw(AssertionError("Browser exception")))(open(p).read()) for p in logs]'
          grep -q 'COMPARISON_SWITCH_PASS' ../evidence/polished-day.log
          grep -q 'NIGHT_IDENTITY_PASS' ../evidence/polished-night.log
          grep -q 'PHONE_SWITCH_PASS' ../evidence/polished-phone.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence
          path: evidence
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: app/dist
